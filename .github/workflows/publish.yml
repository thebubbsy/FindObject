name: Publish to PowerShell Gallery

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          $result = Invoke-Pester -Path ./FindObject.Tests.ps1 -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed" }

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if (-not $env:NUGET_API_KEY) {
              Write-Error "NUGET_API_KEY secret is not set. Please add the secret 'NUGET_API_KEY' to the repository settings."
              exit 1
          }
          Publish-Module -Path . -NuGetApiKey $env:NUGET_API_KEY -Verbose
